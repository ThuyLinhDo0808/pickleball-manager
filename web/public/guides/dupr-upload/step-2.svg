<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Bước 2: chọn chỉ tải các trận đủ DUPR ID">
<rect x="0" y="0" width="480" height="270" fill="#0B1220"/>
<rect x="10" y="10" width="460" height="250" rx="16" fill="#111C33" stroke="#22314F" stroke-width="1"/><text x="30" y="48" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Tải những trận nào?</text><text x="30" y="84" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#E5E7EB" text-anchor="start">2 trận có người chưa có DUPR ID.</text><text x="30" y="116" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">• Chỉ tải 8 trận đủ DUPR ID (nên chọn)</text><text x="30" y="142" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">• Tải cả trận thiếu ID: DUPR có thể không nhận</text><rect x="30" y="190" width="150" height="40" rx="9" fill="#1E2A44" stroke="#334155" stroke-width="1"/><text x="105.0" y="216.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="500" fill="#E5E7EB" text-anchor="middle">Tải cả 10 trận</text><rect x="200" y="190" width="250" height="40" rx="9" fill="#A3E635"/><text x="325.0" y="216.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0B1220" text-anchor="middle">Chỉ tải 8 trận đủ ID</text><rect x="195" y="185" width="260" height="50" rx="12" fill="none" stroke="#A3E635" stroke-width="3" stroke-dasharray="7 5"/><circle cx="420" cy="210" r="15" fill="#A3E635" fill-opacity="0.3"/><circle cx="420" cy="210" r="7" fill="#A3E635"/>
