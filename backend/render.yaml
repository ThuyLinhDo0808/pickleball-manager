services:
  - type: web
    name: pickleball-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOW_TIER_SELF_SERVE
        value: "true"
      - key: CORS_ORIGIN
        sync: false
