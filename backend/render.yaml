services:
  - type: web
    name: pickleball-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOW_TIER_SELF_SERVE
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      # Optional: email feedback to the developer via Resend (https://resend.com)
      - key: RESEND_API_KEY
        sync: false
      - key: FEEDBACK_TO_EMAIL
        sync: false
      - key: FEEDBACK_FROM_EMAIL
        sync: false
      # Optional: also POST each feedback as JSON to a webhook (Apps Script, Zapier, Make, Discord...)
      - key: FEEDBACK_WEBHOOK_URL
        sync: false
      - key: FEEDBACK_WEBHOOK_SECRET
        sync: false
      - key: APP_TZ
        value: Asia/Ho_Chi_Minh
